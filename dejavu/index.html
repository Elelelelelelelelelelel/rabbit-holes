<script>
/* ================================================================

const CONFIG = {
  slug: "dejavu",
  siteTitle: "🌀 The Déjà Vu Rabbit Hole",
  homeHref: "../index.html",

  githubRepo: "yourusername/rabbit-holes",

  /* link to this hole in the other language */
  lang: { href: "../ru/dejavu/", label: "RU" },


  /* What readers collect each time they choose to go deeper. The reward
     characters hold this, the HUD counts it, and the toast names it. */
  token: { emoji: "🌀", name: "echo" },

  theme: {
    accent: "#9B7BE8",
    accentHot: "#C0A8FF",
    accentDeep: "#4E3A8A",
    line: "rgba(155,123,232,.16)"
  },

  depthNames: ["Surface","The Myth","Two Systems","The Overlap","Rhinal Cortex",
               "The Double Signal","The Frequency Curve","Jamais Vu","The Alarm","Bedrock"],

  hero: {
    eyebrow: "An interactive descent · 10 levels deep",
    titleHTML: 'Why do we get <em>déjà vu?</em>',
    icon: `<svg width="72" height="70" viewBox="0 0 72 70" fill="none" aria-hidden="true">
      <circle cx="24" cy="34" r="17" stroke="var(--accent)" stroke-width="2" opacity=".9"/>
      <circle cx="24" cy="34" r="17" stroke="var(--accent)" stroke-width="2" opacity=".35" transform="translate(9 -6)"/>
      <path d="M46 20c6 2 10 8 10 14s-4 12-10 14" stroke="var(--accent)" stroke-width="2" fill="none" opacity=".6"/>
    </svg>`,
    ledeHTML: `You turn a corner in a city you've never visited, and for two seconds you know exactly what's about to happen. It passes before you can even describe it. <b>Nearly two-thirds of people</b> report this at some point — and it isn't a glitch in the universe.`,
    noteHTML: `Descend as far as you like. Every level ends with a <b>checkpoint</b>: stop and surface with a complete answer, or take one more step down.`
  },

  footerHTML: `Built as an interactive explainer · Figures (prevalence, brain regions, study findings) reflect published memory & neuroscience research and are approximate for individuals.`,

  finale: {
    emoji: "🌀",
    title: "Depth 10 / 10 — Bottom reached",
    text: "You descended from “maybe I've lived this before” to two competing memory systems, a mistimed neural signal, and a brain that may be quietly checking its own work. That's the whole hole. Next time it happens, you'll know exactly what just misfired."
  },

  levels: [
    {
      kicker:"Level 1 · The Surface",
      title:"It's a memory system briefly confusing itself",
      bodyHTML:`
        <p>The short answer: déjà vu happens when your brain's <strong>sense of familiarity</strong> fires without any real memory to back it up. For a second or two, something brand new feels unmistakably familiar — and then the feeling passes, because there's genuinely nothing behind it.</p>
        <p>It's remarkably common and, on its own, entirely benign: surveys put lifetime prevalence at roughly <strong>60–70% of people</strong>, most often in their teens and twenties. Nothing paranormal is required, and nothing is wrong with you.</p>
        <p class="dim">Everything below this level explains <em>why</em> a healthy brain does this to itself.</p>`,
      sum:"A good stopping point: déjà vu is familiarity firing without a real memory behind it — common, benign, and not a glitch in reality.",
      take:"Déjà vu is your brain's familiarity signal firing with nothing real behind it. It's common and harmless.",
      fact:"Déjà vu is reported less often in children under 8 — the feeling seems to need a mature enough memory system to misfire in the first place."
    },
    {
      kicker:"Level 2 · The Myth",
      title:"It isn't a memory of a past life, a simulation glitch, or ESP",
      bodyHTML:`
        <p>Déjà vu has picked up a lot of mystical baggage: past-life memories, glimpses of parallel universes, proof we're inside a simulation that just skipped a frame. None of it holds up, and none of it is needed — the mundane explanation is stranger and better evidenced than the exciting ones.</p>
        <p>The real clue was hiding in the name the phenomenon almost never gets right: people describe déjà vu as remembering the <em>exact same event</em>, but what they can actually detect is only ever a feeling of familiarity — never a specific memory of when, where, or how they supposedly experienced it before. That gap is the whole mystery, and it points straight at memory machinery, not metaphysics.</p>
        <div class="callout"><span class="tag">Key idea</span>
        If it were a genuine memory, you could describe the earlier occasion. You never can. That missing detail is the fingerprint of a familiarity signal firing alone.</div>`,
      sum:"A good stopping point: déjà vu isn't a real memory of a past event — if it were, you could describe it. You never can, which points at a memory-system quirk, not the paranormal.",
      take:"You can never actually describe the “earlier” event in déjà vu — because there isn't one. That missing detail rules out a real memory and points at a system quirk.",
      fact:"Some memory researchers call this the “deceptive familiarity” — the sense of having lived a moment before, entirely detached from any actual prior moment."
    },
    {
      kicker:"Level 3 · Two Systems",
      title:"Familiarity and recollection are separate brain systems",
      bodyHTML:`
        <p>Memory scientists split recognition into two distinct processes that usually work together so smoothly you never notice the seam. <strong>Familiarity</strong> is fast and vague — a gut-level “I've encountered this” with no attached details. <strong>Recollection</strong> is slower and specific — you can say when, where, and how you know something.</p>
        <p>Normally, familiarity is confirmed almost instantly by recollection: you feel you know a face, and half a second later you remember it's your neighbour. <strong>Déjà vu is familiarity firing on its own</strong>, with recollection unable to back it up — because there genuinely isn't a matching memory to retrieve.</p>
        <p class="dim">This dual-process idea isn't a guess built to explain déjà vu after the fact — it was established independently in memory research decades earlier, from studies of ordinary recognition and of patients with selective memory damage.</p>`,
      sum:"A good stopping point: recognition runs on two separate systems, familiarity and recollection — déjà vu is familiarity firing without recollection to back it up.",
      take:"Recognition has two separate channels — fast, vague familiarity and slow, specific recollection. Déjà vu is familiarity firing alone.",
      fact:"Familiarity and recollection can be dissociated in the lab: some amnesia patients retain a working familiarity system whilst almost entirely losing the ability to recollect specific past events."
    },
    {
      kicker:"Level 4 · The Overlap",
      title:"You only need one matching detail, not a matching scene",
      bodyHTML:`
        <p>You don't need to have actually been in a similar room before for it to feel eerily familiar — you just need your current surroundings to share <strong>one structural feature</strong> with somewhere you have been, even if you never consciously notice the overlap.</p>
        <p>Psychologist <strong>Anne Cleary</strong> tested this directly using virtual-reality scenes built in The Sims: she showed people a scene, then later a completely different scene that secretly shared the same spatial layout — a lamp in the same corner, a doorway in the same place. Participants reported déjà vu at significantly higher rates for the spatially matched scenes, despite never spotting the shared layout consciously.</p>
        <p>Try it below: two rooms, only one thing in common.</p>`,
      widget:"overlapGame",
      afterWidgetHTML:`<p class="dim">Your familiarity system picked up on the gestalt of the earlier room — the shape of the space — without ever telling your conscious mind what it noticed.</p>`,
      sum:"A good stopping point: a single shared structural feature between two otherwise different scenes is enough to trigger unconscious familiarity — this is Anne Cleary's spatial-layout research.",
      take:"You don't need a matching scene, just one matching structural detail — Anne Cleary's Sims-scene experiments proved this directly.",
      fact:"Cleary's team later found that déjà vu in these experiments often came with a specific companion feeling: a false sense of being able to predict what would happen next in the scene — a thread that comes back at level 9."
    },
    {
      kicker:"Level 5 · The Machinery",
      title:"One brain region seems to run familiarity on its own",
      bodyHTML:`
        <p>Familiarity and recollection don't just behave differently — they appear to live in different neighbourhoods of the brain's memory system. The <strong>hippocampus</strong> is central to recollection, binding events to their time, place, and context. Nearby, the <strong>rhinal cortex</strong> (specifically the perirhinal cortex) appears able to generate a bare familiarity signal largely on its own.</p>
        <p>Neurologist <strong>Chris Moulin</strong> and colleagues proposed that déjà vu results from the rhinal cortex firing its familiarity signal in isolation — misfiring, essentially — whilst the hippocampus stays quiet because there's no actual matching memory to retrieve.</p>
        <div class="stat-row">
          <div class="stat"><div class="n">2</div><div class="l">separate memory regions involved: hippocampus and rhinal cortex</div></div>
          <div class="stat"><div class="n">60–70%</div><div class="l">of people report déjà vu at least once</div></div>
          <div class="stat"><div class="n">1</div><div class="l">of the two regions needs to misfire to produce it</div></div>
        </div>`,
      sum:"A good stopping point: familiarity and recollection map onto different brain regions — the rhinal cortex and the hippocampus — and déjà vu looks like the rhinal cortex firing alone.",
      take:"The rhinal cortex seems to generate raw familiarity by itself; déjà vu may be that signal firing without the hippocampus's recollection to back it up.",
      fact:"The rhinal cortex sits directly next to the hippocampus in the brain's temporal lobe — two adjacent regions with two very different jobs in memory."
    },
    {
      kicker:"Level 6 · The Double Signal",
      title:"A classic theory: your brain processes the moment twice",
      bodyHTML:`
        <p>One of the oldest scientific explanations for déjà vu, proposed by neuroscientist <strong>Robert Efron</strong> in 1963, suggests a timing glitch rather than a content error. Efron argued the brain processes incoming sensory information <strong>twice in quick succession</strong> — a rapid double-check that normally happens seamlessly.</p>
        <p>If the second pass arrives at the recognition centre with an unusually long delay, the theory goes, the brain may misinterpret the second copy as a <em>separate, older</em> experience rather than a duplicate of the one happening right now — producing the sensation that this exact moment already happened once before.</p>
        <p class="dim">This idea has since been supplemented, not replaced, by the rhinal-cortex account above — the two explanations describe the same event at different levels: one about which brain region misfires, the other about timing between processing passes.</p>`,
      sum:"A good stopping point: one classic theory holds that déjà vu comes from a tiny processing delay — the brain double-checking a moment and mistaking the second pass for an older memory.",
      take:"Robert Efron's 1963 theory: the brain processes each moment twice, and a slight delay between passes can make the second copy feel like an older memory.",
      fact:"Efron developed the idea whilst studying epileptic patients — a population that, as the next level shows, experiences déjà vu unusually often."
    },
    {
      kicker:"Level 7 · The Frequency Curve",
      title:"Younger, more travelled, more tired — the pattern isn't what you'd expect",
      bodyHTML:`
        <p>If déjà vu were simply “your brain wearing out,” you'd expect it to rise with age. It does the opposite: reported frequency <strong>peaks in the late teens and twenties</strong> and then steadily declines, even though older adults have had far more time to accumulate overlapping memories to draw on.</p>
        <p>Other reliable correlates: people who <strong>travel more</strong>, who <strong>remember their dreams</strong> more often, and who have <strong>higher levels of education</strong> report more déjà vu. Fatigue and stress raise the rate too. One leading theory ties several of these together: novel environments and higher cognitive engagement simply give the familiarity system more raw material — more scenes with partial overlaps — to misfire on.</p>
        <div class="callout"><span class="tag">Counter-intuitive</span>
        Déjà vu falling with age is one of the strongest arguments against it being a sign of memory decline. If anything, the data points the other way.</div>`,
      sum:"A good stopping point: déjà vu peaks in young adulthood and declines with age, and correlates with travel, dream recall, and education — the opposite pattern you'd expect from memory decline.",
      take:"Déjà vu frequency peaks in the late teens and twenties, then declines — the opposite of what memory decline would predict.",
      fact:"Some researchers estimate déjà vu prevalence drops to under 40% in people over 60, roughly half the rate seen in people in their twenties."
    },
    {
      kicker:"Level 8 · Jamais Vu",
      title:"The mirror-image glitch: when the familiar suddenly isn't",
      bodyHTML:`
        <p>If déjà vu is false familiarity, its opposite exists too: <strong>jamais vu</strong> — a genuinely familiar thing suddenly, briefly, feeling completely unfamiliar. You've likely triggered a mild version yourself: stare at an ordinary word, or write it out repeatedly, and within a couple of dozen repetitions it can start to look like nonsense, as if the word has never meant anything at all.</p>
        <p>Researchers <strong>Akira O'Connor and Chris Moulin</strong> tested this directly in a 2021 study: volunteers wrote a common word, such as “door,” by hand up to 30 times in a row. A majority — around <strong>68%</strong> — reported the word starting to feel strange, foreign, or as if it had lost its meaning, a lab-inducible taste of jamais vu.</p>
        <p class="dim">Jamais vu is thought to be the same familiarity system misfiring in the opposite direction — reporting “new” when it should report “known,” rather than the other way around.</p>`,
      sum:"A good stopping point: jamais vu is déjà vu's mirror image — familiar things suddenly feeling unfamiliar — and it can be triggered in the lab simply by writing a word repeatedly.",
      take:"Jamais vu is the opposite glitch: something familiar suddenly feels foreign. Repeating a word by hand ~30 times reliably triggers it in most people.",
      fact:"The effect has a name of its own in psycholinguistics — semantic satiation — first documented decades before anyone connected it to jamais vu specifically."
    },
    {
      kicker:"Level 9 · The Alarm",
      title:"The plot twist: déjà vu might be a feature, not a bug",
      bodyHTML:`
        <p>Here's the level most people never reach. Rather than treating déjà vu purely as noise, some researchers argue it's the visible output of a <strong>working error-checking system</strong> — your brain quietly flagging a mismatch between what it expects to remember and what it can actually retrieve.</p>
        <p>Anne Cleary's later work found something striking: déjà vu often arrives paired with a false sense of being able to <strong>predict what happens next</strong> — a feeling of “I know what's coming” that, when tested, turns out to be no more accurate than chance. That pairing suggests déjà vu isn't just a familiarity glitch in isolation; it may be the conscious signature of a monitoring system checking memory retrieval for conflicts, similar to error-detection circuits documented elsewhere in the frontal brain.</p>
        <p class="dim">On this view, déjà vu is your memory system's version of a spell-checker flagging a word it isn't sure about — not proof that something is wrong, but evidence that the checking process is working exactly as intended.</p>`,
      sum:"A good stopping point: déjà vu may be the visible sign of a memory-monitoring system catching a retrieval conflict — evidence the system works, not that it's broken.",
      take:"Déjà vu may function as a memory-conflict alarm rather than an error — your brain flagging a mismatch, similar to a spell-checker catching a word it isn't sure about.",
      fact:"When researchers actually tested people's “predictions” during déjà vu moments, accuracy was statistically no better than random guessing — the feeling of foresight is itself an illusion layered on top of the first one."
    },
    {
      kicker:"Level 10 · Bedrock",
      title:"The full picture — and a jamais vu experiment of your own",
      bodyHTML:`
        <p>Put the layers together and déjà vu stops looking mysterious and starts looking like an interesting, well-documented seam in ordinary memory: a <strong>rhinal cortex</strong> familiarity signal fires — perhaps triggered by a single shared structural detail with somewhere you've genuinely been — without the <strong>hippocampus</strong> providing a matching recollection. A frontal <strong>monitoring system</strong> notices the mismatch and flags it, and that flag is what you consciously feel as déjà vu, sometimes with a false companion sense of foresight riding along.</p>
        <div class="callout"><span class="tag">The déjà vu equation</span>
        <strong>Rhinal familiarity fires alone</strong> → <strong>hippocampal recollection stays silent</strong> (no real matching memory exists) → a <strong>conflict-monitoring system</strong> flags the mismatch → you consciously feel “I've been here before,” occasionally paired with a false sense of predicting what's next.</div>
        <p><strong>Want to feel the mirror-image effect yourself?</strong> Pick any short, ordinary word — “door,” “grass,” “window” — and write it out by hand, slowly, about 25–30 times. Most people notice the word starting to look foreign or lose its meaning partway through: a small, safe, self-inducible taste of jamais vu, and a neat demonstration that your familiarity system can be nudged in either direction.</p>
        <p class="dim">One caveat worth keeping: occasional déjà vu in a healthy adult is entirely normal. Very frequent déjà vu, especially alongside other unusual sensations, can occasionally be an early symptom of temporal lobe epilepsy and is worth mentioning to a doctor — but for the vast majority of people, it's simply a memory system doing its ordinary, slightly imperfect job.</p>`,
      widget:"notePanel",
      sum:"",
      take:"The full picture: rhinal familiarity fires without hippocampal recollection, a monitoring system flags the mismatch, and you feel déjà vu — sometimes with a false sense of foresight riding along. Try the word-repetition jamais vu experiment yourself."
    }
  ]
};

const WIDGETS = {
  /* Level 4: two "rooms" that share exactly one structural detail —
     illustrating that a single overlap, not a whole matching scene,
     is enough to trigger a false sense of familiarity. */
  overlapGame: {
    html: `
      <div class="sim">
        <h4>Spot the single overlap</h4>
        <p style="font-size:14.5px;color:var(--dim);margin-bottom:14px">Two completely different rooms. Before you reveal it, notice how neither one, on its own, feels like anything special.</p>
        <div class="sim-grid" style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
          <div style="padding:14px;border-radius:10px;background:rgba(7,11,20,.5);border:1px solid rgba(143,163,196,.15)">
            <div style="font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Room A · a friend's kitchen</div>
            <div style="font-size:14px;line-height:1.5">Yellow walls. A round table by the window. A cat asleep on a stool. <span data-el="tagA" style="color:var(--accent-hot);font-weight:700">A lamp in the far left corner.</span></div>
          </div>
          <div style="padding:14px;border-radius:10px;background:rgba(7,11,20,.5);border:1px solid rgba(143,163,196,.15)">
            <div style="font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Room B · a hotel lobby, another country</div>
            <div style="font-size:14px;line-height:1.5">Marble floor. A tall plant by the door. Piano music playing softly. <span data-el="tagB" style="color:var(--accent-hot);font-weight:700">A lamp in the far left corner.</span></div>
          </div>
        </div>
        <button class="btn btn-deeper" type="button" data-el="reveal" style="margin-top:16px;width:100%">Reveal the overlap</button>
        <div class="sim-result" data-el="result" hidden style="margin-top:14px">
          <div class="cap">One shared detail — the lamp's position — is structurally enough for your familiarity system to flag Room B as “known,” even though nothing else matches and you've never set foot in either place.</div>
        </div>
      </div>`,
    init(root){
      root.querySelector('[data-el="tagA"]').style.display = "inline";
      root.querySelector('[data-el="tagB"]').style.opacity = "0";
      root.querySelector('[data-el="tagB"]').style.transition = "opacity .6s ease";
      root.querySelector('[data-el="reveal"]').addEventListener("click", e=>{
        root.querySelector('[data-el="tagB"]').style.opacity = "1";
        root.querySelector('[data-el="result"]').hidden = false;
        e.target.disabled = true;
        e.target.textContent = "Overlap revealed ↑";
      });
    }
  },

  notePanel: {
    html: `
      <div class="sim">
        <h4>Send a note</h4>
        <p style="font-size:14.5px;color:var(--dim)">Tried it yourself? Spotted an error? Have a theory of your own, or a question that deserves its own ten levels? Post it on GitHub — no email needed, and I read every one.</p>
        <div class="share-row">
          <a class="btn btn-deeper btn-mini" data-el="note" target="_blank" rel="noopener">✍️ Send a note about this hole</a>
          <a class="btn btn-stop btn-mini" data-el="all" target="_blank" rel="noopener">Read what others sent</a>
        </div>
        <div class="share-note">Opens a ready-filled form on GitHub. You'll need a GitHub account to post.</div>
      </div>`,
    init(root){
      const repo = REPO;
      const params = new URLSearchParams({
        template: "reader-note.yml",
        title: "[Note] " + CONFIG.siteTitle,
        labels: "reader-note"
      });
      root.querySelector('[data-el="note"]').href = `https://github.com/${repo}/issues/new?${params.toString()}`;
      root.querySelector('[data-el="all"]').href = `https://github.com/${repo}/issues?q=is%3Aissue+label%3Areader-note`;
    }
  }
};

/* ================================================================
   ⚙️  ENGINE — shared across every rabbit hole. No need to edit.
   ================================================================ */
(function(){
  "use strict";
  const L = CONFIG.levels, N = L.length;
  const KEY = "rh-progress-" + CONFIG.slug;
  let current = 1;

  /* Work out the GitHub repository from the address bar when the site is
     served from *.github.io, so the note links keep working even if the
     CONFIG.githubRepo placeholder was never replaced. Falls back to the
     configured value on custom domains or local files. */
  const REPO = (function(fallback){
    try{
      const host = location.hostname;
      if(host.endsWith(".github.io")){
        const user = host.slice(0, -".github.io".length);
        const seg  = location.pathname.split("/").filter(Boolean);
        return user + "/" + (seg.length ? seg[0] : host);
      }
    }catch(e){}
    return fallback;
  })(CONFIG.githubRepo);

  /* interface strings — English defaults, overridable per page via CONFIG.ui
     so a translated edition can reuse this identical engine */
  const T = Object.assign({
    depth:"Depth", level:"Level", checkpoint:"Checkpoint",
    goDeeper:"Go deeper ↓", nextLevel:"Level",
    stopHere:"Stop here — I've learnt enough",
    cpHint:"Stopping here is a legitimate ending — every level above is a complete answer at its own depth. Choose to go deeper and you'll earn a {token} for the descent.",
    unlocked:"LEVEL {n} UNLOCKED",
    reset:"Reset my progress",
    finaleHome:"⌂ Surface — back to all rabbit holes"
  }, CONFIG.ui || {});

  /* the reward cast — overridable per page via CONFIG.rewards */
  const REWARDS = CONFIG.rewards || [
    {animal:"🦥", line:"No rush down here. Take it at your own pace."},
    {animal:"🦉", line:"Curiosity suits you. Let's go further."},
    {animal:"🦊", line:"Most people stop before this one. You didn't."},
    {animal:"🐧", line:"Down we go — one level colder, one level clearer."},
    {animal:"🐨", line:"Comfortable? Good. It gets stranger from here."},
    {animal:"🐿️", line:"Another layer, another thing worth keeping."},
    {animal:"🦔", line:"Brave of you. It's cosier down here than it looks."},
    {animal:"🐢", line:"Steady as you like. The depth isn't going anywhere."},
    {animal:"🦦", line:"Delighted you're still with us. Onwards."},
    {animal:"🐼", line:"A fine decision. Settle in."}
  ];

  /* theme */
  const r = document.documentElement.style;
  r.setProperty("--accent", CONFIG.theme.accent);
  r.setProperty("--accent-hot", CONFIG.theme.accentHot);
  r.setProperty("--accent-deep", CONFIG.theme.accentDeep);
  r.setProperty("--line", CONFIG.theme.line);

  /* HUD */
  const home = document.getElementById("hudHome");
  home.textContent = CONFIG.siteTitle;
  home.href = CONFIG.homeHref;
  if(CONFIG.lang){
    const ls = document.getElementById("langSwitch");
    ls.href = CONFIG.lang.href;
    ls.textContent = CONFIG.lang.label;
    ls.hidden = false;
  }
  const depthBar = document.getElementById("depthBar");
  for(let i=0;i<N;i++){ const s=document.createElement("div"); s.className="depth-seg"; depthBar.appendChild(s); }
  function updateHud(){
    depthBar.querySelectorAll(".depth-seg").forEach((s,i)=>s.classList.toggle("filled", i<current));
    depthBar.setAttribute("aria-label", `Depth progress: level ${current} of ${N}`);
    const earned = current - 1;
    document.getElementById("hudDepth").innerHTML =
      `<span class="hide-s">${T.depth} </span><strong>${T.level} ${current} / ${N}</strong> · ${CONFIG.depthNames[current-1]}` +
      (earned > 0 ? ` · ${CONFIG.token.emoji} ×${earned}` : "");
  }

  /* hero */
  const main = document.getElementById("main");
  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="eyebrow">${CONFIG.hero.eyebrow}</div>
    <h1>${CONFIG.hero.titleHTML}</h1>
    <div class="hero-lede">${CONFIG.hero.icon}<p class="hero-note">${CONFIG.hero.ledeHTML}</p></div>
    <p class="hero-note">${CONFIG.hero.noteHTML}</p>`;
  main.appendChild(hero);

  /* level cards */
  L.forEach((lv,i)=>{
    const n = i+1;
    const card = document.createElement("section");
    card.className = "level" + (n===1 ? "" : " locked");
    card.id = "lv"+n;
    let inner = `
      <div class="level-head">
        <div class="lv-badge">${n}</div>
        <div class="lv-meta"><div class="lv-kicker">${lv.kicker}</div><h2>${lv.title}</h2></div>
      </div>
      <div class="level-body">${lv.bodyHTML}
        ${lv.widget && WIDGETS[lv.widget] ? WIDGETS[lv.widget].html : ""}
        ${lv.afterWidgetHTML || ""}
      </div>`;
    if(n < N){
      inner += `
      <div class="checkpoint">
        <div class="cp-label">◈ ${T.checkpoint} ${n} / ${N}</div>
        <div class="cp-sum">${lv.sum}</div>
        <div class="cp-actions">
          <button class="btn btn-deeper" type="button" data-next="${n+1}">${T.goDeeper} &nbsp;${T.nextLevel} ${n+1}: ${L[n].title}</button>
          <button class="btn btn-stop" type="button" data-stop="${n}">${T.stopHere}</button>
        </div>
        <div class="cp-hint">${T.cpHint.replace("{token}", CONFIG.token.name)}</div>
      </div>`;
    } else {
      inner += `
      <div class="finale">
        <div class="medal" aria-hidden="true">${CONFIG.finale.emoji}</div>
        <h2>${CONFIG.finale.title}</h2>
        <p>${CONFIG.finale.text}</p>
        <a class="btn btn-deeper finale-home" href="${CONFIG.homeHref}">${T.finaleHome}</a>
      </div>`;
    }
    card.innerHTML = inner;
    main.appendChild(card);
    if(lv.widget && WIDGETS[lv.widget]) WIDGETS[lv.widget].init(card);
  });

  /* footer */
  document.getElementById("pageFooter").innerHTML =
    CONFIG.footerHTML + ` · <button type="button" id="resetProg">${T.reset}</button>`;
  document.getElementById("resetProg").addEventListener("click", ()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  /* progress persistence */
  function save(){ try{ localStorage.setItem(KEY, String(current)); }catch(e){} }
  function restore(){
    let saved = 1;
    try{ saved = parseInt(localStorage.getItem(KEY)||"1",10)||1; }catch(e){}
    saved = Math.min(Math.max(saved,1), N);
    for(let n=2;n<=saved;n++) document.getElementById("lv"+n).classList.remove("locked");
    current = saved;
  }

  /* toast */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 2600);
  }

    let lastReward = -1;
  function pickReward(){
    let i;
    do{ i = Math.floor(Math.random()*REWARDS.length); } while(i === lastReward && REWARDS.length > 1);
    lastReward = i;
    return REWARDS[i];
  }

  /* build the reward card shown at the top of a newly opened level.
     `fact` comes from the level just left behind — a bonus nugget one
     layer deeper than what they've read. */
  function rewardCard(fromLevel){
    const r = pickReward(), tok = CONFIG.token;
    const fact = (L[fromLevel-1] || {}).fact;
    return `<div class="reward">
      <div class="reward-top">
        <div class="reward-animal" aria-hidden="true">${r.animal}${tok.emoji}</div>
        <div class="reward-line">${r.line}</div>
      </div>
      <div class="reward-token">${tok.emoji} +1 ${tok.name}${fact ? `<span class="reward-fact">${fact}</span>` : ""}</div>
    </div>`;
  }

  /* unlock */
  function unlock(n){
    const card = document.getElementById("lv"+n);
    if(!card.classList.contains("locked")){
      card.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    card.classList.remove("locked");
    card.classList.add("unlocking");
    current = Math.max(current, n);
    save();
    updateHud();

    /* place the descent reward at the top of the level they just opened */
    const body = card.querySelector(".level-body");
    if(body && !card.dataset.rewarded){
      body.insertAdjacentHTML("afterbegin", rewardCard(n-1));
      card.dataset.rewarded = "1";
    }

    showToast(`⬢ ${T.unlocked.replace("{n}", n)} · ${CONFIG.token.emoji} +1 ${CONFIG.token.name.toUpperCase()}`);
    requestAnimationFrame(()=>setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60));
    card.addEventListener("animationend", ()=>card.classList.remove("unlocking"), {once:true});
  }

  /* surface modal */
  /* surface modal */
  const scrim = document.getElementById("modalScrim");
  const modalList = document.getElementById("modalList");
  let stoppedAt = 1;
  function openModal(n){
    stoppedAt = n;
    document.getElementById("modalLevel").textContent = n;
    modalList.innerHTML = "";
    for(let i=0;i<n;i++){
      const li = document.createElement("li");
      li.textContent = L[i].take;
      modalList.appendChild(li);
    }
    scrim.classList.add("open");
    document.getElementById("modalResume").focus();
  }
  function closeModal(){ scrim.classList.remove("open"); }
  document.getElementById("modalHome").href = CONFIG.homeHref;
  document.getElementById("modalResume").addEventListener("click", ()=>{
    const n = Math.min(stoppedAt+1, N);
    closeModal();
    unlock(n);
  });
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  /* clicks */
  document.body.addEventListener("click", e=>{
    const deeper = e.target.closest("[data-next]");
    if(deeper){ unlock(parseInt(deeper.dataset.next,10)); return; }
    const stop = e.target.closest("[data-stop]");
    if(stop){ openModal(parseInt(stop.dataset.stop,10)); }
  });

  restore();
  restore();
  updateHud();
})();
</script>
</body>
</html>
