<style>
  :root{
    --ink-deep:#070B14;
    --ink:#0D1424;
    --ink-raise:#16203A;
    --accent:#E8A44C;       /* set per rabbit hole via CONFIG.theme */
    --accent-hot:#FFC46B;
    --accent-deep:#8A5A1E;
    --crema:#F2E7D5;
    --dim:#8FA3C4;
    --line:rgba(232,164,76,.16);
    --danger:#E86A5C;
    --ok:#7BC68F;
    --display:'Chakra Petch',sans-serif;
    --body:'Karla',sans-serif;
    --radius:14px;
    --maxw:760px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink-deep);color:var(--crema);font-family:var(--body);font-size:17px;line-height:1.65;overflow-x:hidden}
  ::selection{background:var(--accent);color:var(--ink-deep)}
  a{color:var(--accent-hot)}

  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 500px at 80% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(30,43,77,.55), transparent 65%),
      var(--ink-deep);}
  .backdrop::after{content:"";position:absolute;inset:0;background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, rgba(242,231,213,.35), transparent 100%),
      radial-gradient(1px 1px at 34% 64%, rgba(242,231,213,.22), transparent 100%),
      radial-gradient(1.4px 1.4px at 58% 18%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 100%),
      radial-gradient(1px 1px at 72% 48%, rgba(242,231,213,.20), transparent 100%),
      radial-gradient(1.2px 1.2px at 88% 76%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 100%),
      radial-gradient(1px 1px at 22% 86%, rgba(242,231,213,.18), transparent 100%);}

  .hud{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(7,11,20,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hud-inner{max-width:var(--maxw);margin:0 auto;padding:10px 20px 12px}
  .hud-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .hud-title{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
  .hud-title a{color:inherit;text-decoration:none}
  .hud-depth{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud-depth strong{color:var(--crema)}
  .depth-bar{margin-top:8px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .depth-seg{height:6px;border-radius:3px;background:var(--ink-raise);border:1px solid rgba(143,163,196,.15);transition:background .5s ease, box-shadow .5s ease}
  .depth-seg.filled{background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-color:transparent;box-shadow:0 0 10px color-mix(in srgb, var(--accent) 45%, transparent)}

  main{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:120px 20px 80px}

  .hero{padding:40px 0 24px}
  .hero .eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
  .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.6vw,46px);line-height:1.14;margin-bottom:18px}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero-lede{display:flex;align-items:flex-end;gap:14px;margin:26px 0 8px}
  .hero-lede svg{flex:none}
  .steam path{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;opacity:.55;animation:steam 4s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:1.3s;opacity:.35}
  .steam path:nth-child(3){animation-delay:2.4s;opacity:.45}
  @keyframes steam{0%{transform:translateY(4px);opacity:0}35%{opacity:.55}100%{transform:translateY(-10px);opacity:0}}
  .hero-note{font-size:14px;color:var(--dim)}
  .hero-note b{color:var(--crema);font-weight:700}

  .level{margin:34px 0;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(22,32,58,.55), rgba(13,20,36,.9));
    box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
  .level.locked{display:none}
  .level.unlocking{animation:unlock .8s cubic-bezier(.2,.9,.25,1) both}
  @keyframes unlock{
    0%{opacity:0;transform:translateY(46px) scale(.97);filter:brightness(2) saturate(0)}
    60%{filter:brightness(1.25)}
    100%{opacity:1;transform:none;filter:none}}
  .level-head{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.35)}
  .lv-badge{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
    font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink-deep);
    background:linear-gradient(135deg,var(--accent-hot),var(--accent-deep));
    box-shadow:0 0 18px color-mix(in srgb, var(--accent) 35%, transparent)}
  .lv-meta .lv-kicker{font-family:var(--display);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
  .lv-meta h2{font-family:var(--display);font-weight:600;font-size:clamp(19px,3.4vw,24px);line-height:1.2}
  .level-body{padding:26px}
  .level-body p{margin-bottom:16px}
  .level-body p:last-child{margin-bottom:0}
  .level-body .dim{color:var(--dim)}
  .callout{margin:20px 0;padding:16px 18px;border-radius:10px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--accent) 6%, transparent);font-size:15.5px}
  .callout .tag{font-family:var(--display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:6px}
  .stat-row{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
  .stat{flex:1 1 140px;padding:14px 16px;border-radius:10px;background:rgba(7,11,20,.5);border:1px solid rgba(143,163,196,.14)}
  .stat .n{font-family:var(--display);font-weight:700;font-size:24px;color:var(--accent)}
  .stat .l{font-size:13px;color:var(--dim);line-height:1.4;margin-top:2px}

  .checkpoint{padding:20px 26px 24px;border-top:1px dashed rgba(143,163,196,.25);background:rgba(7,11,20,.3)}
  .checkpoint .cp-label{font-family:var(--display);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .checkpoint .cp-sum{font-size:15.5px;margin-bottom:16px}
  .cp-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{font-family:var(--display);font-weight:700;letter-spacing:.08em;border-radius:10px;cursor:pointer;border:none;
    padding:13px 22px;font-size:14.5px;transition:transform .15s ease, box-shadow .2s ease}
  .btn:focus-visible{outline:2px solid var(--accent-hot);outline-offset:3px}
  a.btn{text-decoration:none;display:inline-block;text-align:center}
  .btn-deeper{color:var(--ink-deep);background:linear-gradient(135deg,var(--accent-hot),var(--accent));
    box-shadow:0 6px 22px color-mix(in srgb, var(--accent) 35%, transparent)}
  .btn-deeper:hover{transform:translateY(-2px);box-shadow:0 10px 28px color-mix(in srgb, var(--accent) 50%, transparent)}
  .btn-deeper:active{transform:translateY(0)}
  .btn-stop{color:var(--dim);background:transparent;border:1px solid rgba(143,163,196,.3);font-weight:600}
  .btn-stop:hover{color:var(--crema);border-color:var(--dim)}
  .cp-hint{font-size:13px;color:var(--dim);flex-basis:100%}

  .toast{position:fixed;top:76px;right:18px;z-index:60;background:var(--ink-raise);border:1px solid var(--accent);
    border-radius:10px;padding:12px 18px;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--accent-hot);
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px color-mix(in srgb, var(--accent) 25%, transparent);
    opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .35s ease, transform .35s ease;max-width:min(86vw,360px)}
  .toast.show{opacity:1;transform:none}

  .modal-scrim{position:fixed;inset:0;z-index:70;background:rgba(7,11,20,.7);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px}
  .modal-scrim.open{display:flex}
  .modal{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--ink);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal h3{font-family:var(--display);font-size:20px;margin-bottom:4px}
  .modal .sub{color:var(--dim);font-size:14px;margin-bottom:18px}
  .modal ul{list-style:none;margin-bottom:20px}
  .modal li{padding:9px 0 9px 26px;position:relative;font-size:15px;border-bottom:1px solid rgba(143,163,196,.1)}
  .modal li::before{content:"";position:absolute;left:4px;top:16px;width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .modal .cp-actions{margin-top:4px}

  .sim{margin:22px 0;padding:20px;border-radius:12px;background:rgba(7,11,20,.55);border:1px solid rgba(143,163,196,.16)}
  .sim h4{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  .sim-grid{display:grid;gap:16px}
  .sim label{font-size:13.5px;color:var(--dim);display:block;margin-bottom:6px}
  .sim label output{color:var(--crema);font-weight:700}
  input[type=range]{width:100%;appearance:none;height:6px;border-radius:3px;background:var(--ink-raise);outline:none}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);
    border:3px solid var(--ink-deep);box-shadow:0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--ink-deep);cursor:pointer}
  .metab-toggle{display:flex;gap:8px;flex-wrap:wrap}
  .metab-toggle button{flex:1 1 90px;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:12.5px;
    letter-spacing:.05em;background:var(--ink-raise);color:var(--dim);border:1px solid rgba(143,163,196,.2);transition:all .2s ease}
  .metab-toggle button.active{background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent-hot);border-color:var(--accent)}
  .sim-result{margin-top:6px;padding:16px;border-radius:10px;text-align:center;background:color-mix(in srgb, var(--accent) 7%, transparent);border:1px solid var(--line)}
  .sim-result .big{font-family:var(--display);font-weight:700;font-size:32px;color:var(--accent-hot)}
  .sim-result .cap{font-size:13.5px;color:var(--dim);margin-top:4px}
  .sim-verdict{font-size:14px;margin-top:10px;font-weight:700}
  .sim-verdict.bad{color:var(--danger)}
  .sim-verdict.mid{color:var(--accent)}
  .sim-verdict.good{color:var(--ok)}

  /* depth-lock puzzles */
  .puzzle{margin-top:16px;padding:18px;border-radius:10px;border:1px solid var(--line);background:rgba(7,11,20,.5)}
  .pz-label{font-family:var(--display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
  .pz-lock{display:inline-block;transition:transform .5s cubic-bezier(.2,.9,.25,1)}
  .puzzle.solved .pz-lock{transform:rotate(-14deg) scale(1.15)}
  .pz-q{font-size:15.5px;font-weight:700;margin:10px 0 14px}
  .pz-opts{display:grid;gap:8px}
  .pz-opts button{text-align:left;padding:11px 14px;border-radius:8px;background:var(--ink-raise);
    border:1px solid rgba(143,163,196,.2);color:var(--crema);cursor:pointer;font:inherit;font-size:14.5px;
    transition:border-color .2s ease, background .2s ease}
  .pz-opts button:hover{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--ink-raise))}
  .pz-opts button:focus-visible{outline:2px solid var(--accent-hot);outline-offset:2px}
  .pz-tf{display:flex;gap:10px}
  .pz-tf button{flex:1;padding:16px;border-radius:8px;font-family:var(--display);font-weight:700;letter-spacing:.05em;
    background:var(--ink-raise);border:1px solid rgba(143,163,196,.2);color:var(--crema);cursor:pointer;transition:all .2s ease}
  .pz-tf button:hover{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--ink-raise))}
  .pz-slider{padding:2px 2px 4px}
  .pz-slider .pz-sval{text-align:center;font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent-hot);margin-bottom:10px}
  .pz-slider button{margin-top:14px;width:100%}
  .pz-feed{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--danger)}
  .puzzle.shake{animation:pzshake .4s ease}
  @keyframes pzshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .puzzle.solved{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 8%, rgba(7,11,20,.5))}
  .pz-solved-msg{font-size:14.5px}
  .pz-solved-msg .pz-fact{display:block;margin-top:8px;color:var(--dim);font-weight:400}
  .pz-solved-msg b{color:var(--ok)}
  .pz-reward{display:flex;align-items:center;gap:14px;margin:12px 0;padding:12px 14px;border-radius:10px;
    background:rgba(7,11,20,.4);border:1px solid rgba(143,163,196,.15)}
  .pz-animal{font-size:34px;line-height:1;flex:none}
  .pz-reward-line{font-size:14.5px;font-style:italic;color:var(--crema)}

  /* discussion panel + shared button row */
  .share-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .btn-mini{padding:10px 16px;font-size:13px}
  .share-note{font-size:12.5px;color:var(--dim);margin-top:8px}

  .finale{text-align:center;padding:40px 26px 44px}
  .finale .medal{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:40px;
    background:radial-gradient(circle at 35% 30%, var(--accent-hot), var(--accent-deep));
    box-shadow:0 0 40px color-mix(in srgb, var(--accent) 50%, transparent), inset 0 0 20px rgba(0,0,0,.25);
    animation:medal 3.2s ease-in-out infinite}
  @keyframes medal{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .finale h2{font-family:var(--display);font-size:26px;margin-bottom:8px}
  .finale p{color:var(--dim);max-width:52ch;margin:0 auto 10px}
  .finale .finale-home{margin-top:20px}

  footer{position:relative;z-index:1;text-align:center;color:var(--dim);font-size:12.5px;padding:0 20px 46px;max-width:var(--maxw);margin:0 auto}
  footer button{background:none;border:none;color:var(--dim);text-decoration:underline;cursor:pointer;font:inherit}

  @media (max-width:560px){
    .level-head{padding:16px 18px}.level-body{padding:20px 18px}.checkpoint{padding:18px}
    .hud-depth span.hide-s{display:none}}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="backdrop" aria-hidden="true"></div>
<header class="hud"><div class="hud-inner">
  <div class="hud-row">
    <div class="hud-title"><a href="../index.html" id="hudHome"></a></div>

</div>

<script>
/* ================================================================
   ✏️  EDIT THIS SECTION ONLY — everything below "ENGINE" is shared
   ================================================================ */
const CONFIG = {
  slug: "dejavu",
  siteTitle: "🌀 The Déjà Vu Rabbit Hole",
  homeHref: "../index.html",

  githubRepo: "yourusername/rabbit-holes",

  /* What readers collect for solving depth riddles. The reward
     characters hold this, the HUD counts it, and the toast names it. */
  token: { emoji: "🌀", name: "echo" },

  theme: {
    accent: "#9B7BE8",
    accentHot: "#C0A8FF",
    accentDeep: "#4E3A8A",
    line: "rgba(155,123,232,.16)"
  },

  depthNames: ["Surface","The Myth","Two Systems","The Overlap","Rhinal Cortex",
               "The Double Signal","The Frequency Curve","Jamais Vu","The Alarm","Bedrock"],

  hero: {
    eyebrow: "An interactive descent · 10 levels deep",
    titleHTML: 'Why do we get <em>déjà vu?</em>',
    icon: `<svg width="72" height="70" viewBox="0 0 72 70" fill="none" aria-hidden="true">
      <circle cx="24" cy="34" r="17" stroke="var(--accent)" stroke-width="2" opacity=".9"/>
      <circle cx="24" cy="34" r="17" stroke="var(--accent)" stroke-width="2" opacity=".35" transform="translate(9 -6)"/>
      <path d="M46 20c6 2 10 8 10 14s-4 12-10 14" stroke="var(--accent)" stroke-width="2" fill="none" opacity=".6"/>
    </svg>`,
    ledeHTML: `You turn a corner in a city you've never visited, and for two seconds you know exactly what's about to happen. It passes before you can even describe it. <b>Nearly two-thirds of people</b> report this at some point — and it isn't a glitch in the universe.`,
    noteHTML: `Descend as far as you like. Every level ends with a <b>checkpoint</b>: stop and surface with a complete answer, or answer the depth riddle and go deeper.`
  },

  footerHTML: `Built as an interactive explainer · Figures (prevalence, brain regions, study findings) reflect published memory & neuroscience research and are approximate for individuals.`,

  finale: {
    emoji: "🌀",
    title: "Depth 10 / 10 — Bottom reached",
    text: "You descended from “maybe I've lived this before” to two competing memory systems, a mistimed neural signal, and a brain that may be quietly checking its own work. That's the whole hole. Next time it happens, you'll know exactly what just misfired."
  },

  levels: [
    {
      kicker:"Level 1 · The Surface",
      title:"It's a memory system briefly confusing itself",
      bodyHTML:`
        <p>The short answer: déjà vu happens when your brain's <strong>sense of familiarity</strong> fires without any real memory to back it up. For a second or two, something brand new feels unmistakably familiar — and then the feeling passes, because there's genuinely nothing behind it.</p>
        <p>It's remarkably common and, on its own, entirely benign: surveys put lifetime prevalence at roughly <strong>60–70% of people</strong>, most often in their teens and twenties. Nothing paranormal is required, and nothing is wrong with you.</p>
        <p class="dim">Everything below this level explains <em>why</em> a healthy brain does this to itself.</p>`,
      sum:"A good stopping point: déjà vu is familiarity firing without a real memory behind it — common, benign, and not a glitch in reality.",
      take:"Déjà vu is your brain's familiarity signal firing with nothing real behind it. It's common and harmless.",
      puzzle:{
        type:"mcq",
        q:"Roughly what share of people report experiencing déjà vu at some point in their life?",
        options:["Under 5%","About 25%","Roughly 60–70%","Nearly everyone, 99%"],
        answer:2,
        wrong:"Rarer than that, actually try again — this is one of the most common odd experiences people have.",
        hint:"The level calls it out directly: most people, most often when young.",
        fact:"Déjà vu is reported less often in children under 8 — the feeling seems to need a mature enough memory system to misfire in the first place."
      }
    },
    {
      kicker:"Level 2 · The Myth",
      title:"It isn't a memory of a past life, a simulation glitch, or ESP",
      bodyHTML:`
        <p>Déjà vu has picked up a lot of mystical baggage: past-life memories, glimpses of parallel universes, proof we're inside a simulation that just skipped a frame. None of it holds up, and none of it is needed — the mundane explanation is stranger and better evidenced than the exciting ones.</p>
        <p>The real clue was hiding in the name the phenomenon almost never gets right: people describe déjà vu as remembering the <em>exact same event</em>, but what they can actually detect is only ever a feeling of familiarity — never a specific memory of when, where, or how they supposedly experienced it before. That gap is the whole mystery, and it points straight at memory machinery, not metaphysics.</p>
        <div class="callout"><span class="tag">Key idea</span>

(function(){
  "use strict";
  const L = CONFIG.levels, N = L.length;
  const KEY = "rh-progress-" + CONFIG.slug;
  let current = 1;

  /* theme */
  const r = document.documentElement.style;
  r.setProperty("--accent", CONFIG.theme.accent);
  r.setProperty("--accent-hot", CONFIG.theme.accentHot);
  r.setProperty("--accent-deep", CONFIG.theme.accentDeep);
  r.setProperty("--line", CONFIG.theme.line);

  /* HUD */
  const home = document.getElementById("hudHome");
  home.textContent = CONFIG.siteTitle;
  home.href = CONFIG.homeHref;
  const depthBar = document.getElementById("depthBar");
  for(let i=0;i<N;i++){ const s=document.createElement("div"); s.className="depth-seg"; depthBar.appendChild(s); }
  function updateHud(){
    depthBar.querySelectorAll(".depth-seg").forEach((s,i)=>s.classList.toggle("filled", i<current));
    depthBar.setAttribute("aria-label", `Depth progress: level ${current} of ${N}`);
    const earned = current - 1;
    document.getElementById("hudDepth").innerHTML =
      `<span class="hide-s">Depth </span><strong>Level ${current} / ${N}</strong> · ${CONFIG.depthNames[current-1]}` +
      (earned > 0 ? ` · ${CONFIG.token.emoji} ×${earned}` : "");
  }

  /* hero */
  const main = document.getElementById("main");
  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="eyebrow">${CONFIG.hero.eyebrow}</div>
    <h1>${CONFIG.hero.titleHTML}</h1>
    <div class="hero-lede">${CONFIG.hero.icon}<p class="hero-note">${CONFIG.hero.ledeHTML}</p></div>
    <p class="hero-note">${CONFIG.hero.noteHTML}</p>`;
  main.appendChild(hero);

  /* build a depth-lock puzzle panel. mcq options are shuffled per page-load
     so the answer position isn't memorable between attempts. */
  function renderPuzzle(n, pz){
    let body = "";
    if(pz.type === "truefalse"){
      body = `<div class="pz-tf">
        <button type="button" data-tf="true">✅ True</button>
        <button type="button" data-tf="false">❌ False</button>
      </div>`;
    } else if(pz.type === "slider"){
      const step = pz.step || 1;
      const mid = pz.min + Math.round(((pz.min + pz.max) / 2 - pz.min) / step) * step;
      body = `<div class="pz-slider">
        <div class="pz-sval" data-el="sval">${mid}${pz.unit||""}</div>
        <input type="range" data-el="sinput" min="${pz.min}" max="${pz.max}" step="${pz.step||1}" value="${mid}">
        <button class="btn btn-deeper" type="button" data-el="sguess">Lock in this guess</button>
      </div>`;
    } else { // mcq — shuffle option order, remember the real answer index
      const idxs = pz.options.map((_,i)=>i);
      for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
      body = `<div class="pz-opts">${idxs.map(i=>`<button type="button" data-opt="${i}">${pz.options[i]}</button>`).join("")}</div>`;
    }
    return `
      <div class="puzzle" data-puzzle="${n}" data-type="${pz.type}" hidden>
        <div class="pz-label"><span class="pz-lock">🔐</span> Depth riddle — answer to descend</div>
        <div class="pz-q">${pz.q}</div>
        ${body}
        <div class="pz-feed" hidden></div>
      </div>`;
  }

  /* level cards */
  L.forEach((lv,i)=>{
    const n = i+1;
    const card = document.createElement("section");
    card.className = "level" + (n===1 ? "" : " locked");
    card.id = "lv"+n;
    let inner = `
      <div class="level-head">
        <div class="lv-badge">${n}</div>
        <div class="lv-meta"><div class="lv-kicker">${lv.kicker}</div><h2>${lv.title}</h2></div>
      </div>
      <div class="level-body">${lv.bodyHTML}
        ${lv.widget && WIDGETS[lv.widget] ? WIDGETS[lv.widget].html : ""}
        ${lv.afterWidgetHTML || ""}
      </div>`;
    if(n < N){
      const pzHTML = lv.puzzle ? renderPuzzle(n, lv.puzzle) : "";
      inner += `
      <div class="checkpoint">
        <div class="cp-label">◈ Checkpoint ${n} / ${N}</div>
        <div class="cp-sum">${lv.sum}</div>
        <div class="cp-actions">
          <button class="btn btn-deeper" type="button" data-next="${n+1}">Go deeper ↓ &nbsp;Level ${n+1}: ${L[n].title}</button>
          <button class="btn btn-stop" type="button" data-stop="${n}">Stop here — I've learnt enough</button>
        </div>${pzHTML}
        <div class="cp-hint">Stopping here is a legitimate ending — every level above is a complete answer at its own depth. Going deeper means answering the depth riddle: one question from what you've just read, worth a ${CONFIG.token.name} and a small reward.</div>
      </div>`;
    } else {
      inner += `
      <div class="finale">
        <div class="medal" aria-hidden="true">${CONFIG.finale.emoji}</div>
        <h2>${CONFIG.finale.title}</h2>
        <p>${CONFIG.finale.text}</p>
        <a class="btn btn-deeper finale-home" href="${CONFIG.homeHref}">⌂ Surface — back to all rabbit holes</a>
      </div>`;
    }
    card.innerHTML = inner;
    main.appendChild(card);
    if(lv.widget && WIDGETS[lv.widget]) WIDGETS[lv.widget].init(card);
  });

  /* footer */
  document.getElementById("pageFooter").innerHTML =
    CONFIG.footerHTML + ` · <button type="button" id="resetProg">Reset my progress</button>`;
  document.getElementById("resetProg").addEventListener("click", ()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  /* progress persistence */
  function save(){ try{ localStorage.setItem(KEY, String(current)); }catch(e){} }
  function restore(){
    let saved = 1;
    try{ saved = parseInt(localStorage.getItem(KEY)||"1",10)||1; }catch(e){}
    saved = Math.min(Math.max(saved,1), N);
    for(let n=2;n<=saved;n++) document.getElementById("lv"+n).classList.remove("locked");
    current = saved;
  }

  /* toast */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 2600);
  }

  /* unlock */
  function unlock(n, msg){
    const card = document.getElementById("lv"+n);
    if(!card.classList.contains("locked")){
      card.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    card.classList.remove("locked");
    card.classList.add("unlocking");
    current = Math.max(current, n);
    save();
    updateHud();
    showToast(msg || `⬢ LEVEL ${n} UNLOCKED — ${L[n-1].title.toUpperCase()}`);
    requestAnimationFrame(()=>setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60));
    card.addEventListener("animationend", ()=>card.classList.remove("unlocking"), {once:true});
  }

  /* the single gate every "go deeper" path must pass through — whether
     clicked from a checkpoint or resumed from the surface modal. This is
     what stops the depth lock being skipped. */
  function attemptAdvance(n){
    const card = document.getElementById("lv"+n);
    if(!card.classList.contains("locked")){ unlock(n); return; }
    const pzPanel = document.querySelector(`[data-puzzle="${n-1}"]`);
    if(pzPanel && !pzPanel.classList.contains("solved")){
      pzPanel.hidden = false;
      pzPanel.scrollIntoView({behavior:"smooth", block:"nearest"});
    } else {
      unlock(n); // no puzzle configured for this level — unlocks freely
    }
  }

  /* a little cast of characters shown when a reader answers a depth riddle
     correctly — each holding this hole's own token (CONFIG.token.emoji),
     always saying something genuinely nice. Picked at random, never the
     same one twice in a row. Lines stay subject-neutral so the cast works
     on every hole in the series. */
  const REWARDS = [
    {animal:"🦥", line:"Slow and thorough. Nicely reasoned."},
    {animal:"🦉", line:"Sharp eyes catch sharp details. Well spotted."},
    {animal:"🦊", line:"Cunning and correct — a rare combination."},
    {animal:"🐧", line:"Cool-headed under pressure. That's the way."},
    {animal:"🐨", line:"Unbothered and unbeaten. Lovely work."},
    {animal:"🐿️", line:"You squirrelled that detail away perfectly."},
    {animal:"🦔", line:"A prickly question, handled with care. Well done."},
    {animal:"🐢", line:"Steady wins it. That was well earned."},
    {animal:"🦦", line:"Playful mind, precise answer. Brilliant."},
    {animal:"🐼", line:"Calm, considered, correct. Exactly right."}
  ];
  let lastReward = -1;
  function pickReward(){
    let i;
    do{ i = Math.floor(Math.random()*REWARDS.length); } while(i === lastReward && REWARDS.length > 1);
    lastReward = i;
    return REWARDS[i];
  }

  /* mark a riddle solved: swap its body for a reward card, then unlock */
  function solvePuzzle(panel, lvN, pz){
    panel.classList.add("solved");
    const r = pickReward();
    const tok = CONFIG.token;
    panel.innerHTML = `
      <div class="pz-label"><span class="pz-lock">🔓</span> Riddle solved</div>
      <div class="pz-reward"><div class="pz-animal" aria-hidden="true">${r.animal}${tok.emoji}</div><div class="pz-reward-line">${r.line}</div></div>
      <div class="pz-solved-msg"><b>+1 ${tok.name}</b>${pz.fact ? `<span class="pz-fact">${pz.fact}</span>` : ""}</div>`;
    unlock(lvN+1, `⬢ RIDDLE SOLVED — LEVEL ${lvN+1} UNLOCKED · ${tok.emoji} +1 ${tok.name.toUpperCase()}`);
  }

  function failPuzzle(panel, pz){
    const wrong = (parseInt(panel.dataset.wrong||"0",10) + 1);
    panel.dataset.wrong = String(wrong);
    const feed = panel.querySelector(".pz-feed");
    feed.hidden = false;
    feed.textContent = (wrong > 1 && pz.hint) ? "Hint: " + pz.hint : (pz.wrong || "Not quite — try again.");
    panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
  }

  /* surface modal */
  const scrim = document.getElementById("modalScrim");
  const modalList = document.getElementById("modalList");
  let stoppedAt = 1;
  function openModal(n){
    stoppedAt = n;
    document.getElementById("modalLevel").textContent = n;
    modalList.innerHTML = "";
    for(let i=0;i<n;i++){
      const li = document.createElement("li");
      li.textContent = L[i].take;
      modalList.appendChild(li);
    }
    scrim.classList.add("open");
    document.getElementById("modalResume").focus();
  }
  function closeModal(){ scrim.classList.remove("open"); }
  document.getElementById("modalHome").href = CONFIG.homeHref;
  document.getElementById("modalResume").addEventListener("click", ()=>{
    const n = Math.min(stoppedAt+1, N);
    closeModal();
    attemptAdvance(n);   // ← goes through the same gate as every other path
  });
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  /* clicks */
  document.body.addEventListener("click", e=>{
    const deeper = e.target.closest("[data-next]");
    if(deeper){ attemptAdvance(parseInt(deeper.dataset.next,10)); return; }

    /* mcq */
    const opt = e.target.closest(".pz-opts button");
    if(opt){
      const panel = opt.closest(".puzzle");
      const lvN = parseInt(panel.dataset.puzzle,10);
      const pz = L[lvN-1].puzzle;
      if(parseInt(opt.dataset.opt,10) === pz.answer) solvePuzzle(panel, lvN, pz);
      else failPuzzle(panel, pz);
      return;
    }
    /* true/false */
    const tf = e.target.closest(".pz-tf button");
    if(tf){
      const panel = tf.closest(".puzzle");
      const lvN = parseInt(panel.dataset.puzzle,10);
      const pz = L[lvN-1].puzzle;
      const chosen = tf.dataset.tf === "true";
      if(chosen === pz.answer) solvePuzzle(panel, lvN, pz);
      else failPuzzle(panel, pz);
      return;
    }
    /* slider guess */
    const sguess = e.target.closest('[data-el="sguess"]');
    if(sguess){
      const panel = sguess.closest(".puzzle");
      const lvN = parseInt(panel.dataset.puzzle,10);
      const pz = L[lvN-1].puzzle;
      const val = parseFloat(panel.querySelector('[data-el="sinput"]').value);
      if(Math.abs(val - pz.target) <= pz.tolerance) solvePuzzle(panel, lvN, pz);
      else failPuzzle(panel, pz);
      return;
    }
    const stop = e.target.closest("[data-stop]");
    if(stop){ openModal(parseInt(stop.dataset.stop,10)); }
  });

  /* live-update slider-guess readouts */
  document.body.addEventListener("input", e=>{
    if(e.target.matches('.puzzle [data-el="sinput"]')){
      const panel = e.target.closest(".puzzle");
      const lvN = parseInt(panel.dataset.puzzle,10);
      const pz = L[lvN-1].puzzle;
      panel.querySelector('[data-el="sval"]').textContent = e.target.value + (pz.unit||"");
    }
  });

  restore();
  updateHud();
})();
</script>
</body>
</html>
