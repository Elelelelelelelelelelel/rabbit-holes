          <div class="sim-verdict mid" data-out="verdict">Примерно целый эспрессо всё ещё в организме.</div>
        </div>
      </div>`,
    init(root){
      const dose = root.querySelector('[data-in="dose"]');
      const hours = root.querySelector('[data-in="hours"]');
      const metab = root.querySelector('[data-in="metab"]');
      const out = k => root.querySelector(`[data-out="${k}"]`);
      let halfLife = 5;
      function run(){
        const d = parseFloat(dose.value), h = parseFloat(hours.value);
        out("dose").textContent = d + " мг";
        out("hours").textContent = h + " ч";
        const mg = Math.round(d * Math.pow(0.5, h / halfLife));
        out("mg").textContent = mg + " мг";
        let cls, msg;
        if(mg >= 90){ cls="bad"; msg="Больше целого эспрессо всё ещё в организме — рецепторы останутся заблокированы глубоко за полночь."; }
        else if(mg >= 40){ cls="mid"; msg="Осталось примерно на один эспрессо — многим этого хватит, чтобы срезать глубокий сон."; }
        else if(mg >= 15){ cls="mid"; msg="Остался след крепостью со слабый чай. Чувствительный мозг заметит, большинство — нет."; }
        else { cls="good"; msg="Практически выведен — этот раунд за давлением сна."; }
        const v = out("verdict");
        v.className = "sim-verdict " + cls;
        v.textContent = msg;
      }
      dose.addEventListener("input", run);
      hours.addEventListener("input", run);
      metab.addEventListener("click", e=>{
        const btn = e.target.closest("button[data-hl]");
        if(!btn) return;
        metab.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        halfLife = parseFloat(btn.dataset.hl);
        run();
      });
      run();
    }
  },

  notePanel: {
    html: `
      <div class="sim">
        <h4>Напишите заметку</h4>
        <p style="font-size:14.5px;color:var(--dim)">Попробовали сами? Нашли ошибку? Есть своя теория или вопрос, достойный собственных десяти уровней? Напишите на GitHub — почта не нужна, я читаю каждую заметку.</p>
        <div class="share-row">
          <a class="btn btn-deeper btn-mini" data-el="note" target="_blank" rel="noopener">✍️ Написать об этой норе</a>
          <a class="btn btn-stop btn-mini" data-el="all" target="_blank" rel="noopener">Почитать заметки других</a>
        </div>
        <div class="share-note">Откроется заранее заполненная форма на GitHub. Для отправки нужен аккаунт GitHub.</div>
      </div>`,
    init(root){
      const repo = REPO;
      const params = new URLSearchParams({
        template: "reader-note.yml",
        title: "[Заметка] " + CONFIG.siteTitle,
        labels: "reader-note"
      });
      root.querySelector('[data-el="note"]').href = `https://github.com/${repo}/issues/new?${params.toString()}`;
      root.querySelector('[data-el="all"]').href = `https://github.com/${repo}/issues?q=is%3Aissue+label%3Areader-note`;
    }
  }
};

/* ================================================================
   ⚙️  ENGINE — shared across every rabbit hole. No need to edit.
   ================================================================ */
(function(){
  "use strict";
  const L = CONFIG.levels, N = L.length;
  const KEY = "rh-progress-" + CONFIG.slug;
  let current = 1;

  /* Work out the GitHub repository from the address bar when the site is
     served from *.github.io, so the note links keep working even if the
     CONFIG.githubRepo placeholder was never replaced. Falls back to the
     configured value on custom domains or local files. */
  const REPO = (function(fallback){
    try{
      const host = location.hostname;
      if(host.endsWith(".github.io")){
        const user = host.slice(0, -".github.io".length);
        const seg  = location.pathname.split("/").filter(Boolean);
        return user + "/" + (seg.length ? seg[0] : host);
      }
    }catch(e){}
    return fallback;
  })(CONFIG.githubRepo);

  /* interface strings — English defaults, overridable per page via CONFIG.ui
     so a translated edition can reuse this identical engine */
  const T = Object.assign({
    depth:"Depth", level:"Level", checkpoint:"Checkpoint",
    goDeeper:"Go deeper ↓", nextLevel:"Level",
    stopHere:"Stop here — I've learnt enough",
    cpHint:"Stopping here is a legitimate ending — every level above is a complete answer at its own depth. Choose to go deeper and you'll earn a {token} for the descent.",
    unlocked:"LEVEL {n} UNLOCKED",
    reset:"Reset my progress",
    finaleHome:"⌂ Surface — back to all rabbit holes"
  }, CONFIG.ui || {});

  /* the reward cast — overridable per page via CONFIG.rewards */
  const REWARDS = CONFIG.rewards || [
    {animal:"🦥", line:"No rush down here. Take it at your own pace."},
    {animal:"🦉", line:"Curiosity suits you. Let's go further."},
    {animal:"🦊", line:"Most people stop before this one. You didn't."},
    {animal:"🐧", line:"Down we go — one level colder, one level clearer."},
    {animal:"🐨", line:"Comfortable? Good. It gets stranger from here."},
    {animal:"🐿️", line:"Another layer, another thing worth keeping."},
    {animal:"🦔", line:"Brave of you. It's cosier down here than it looks."},
    {animal:"🐢", line:"Steady as you like. The depth isn't going anywhere."},
    {animal:"🦦", line:"Delighted you're still with us. Onwards."},
    {animal:"🐼", line:"A fine decision. Settle in."}
  ];

  /* theme */
  const r = document.documentElement.style;
  r.setProperty("--accent", CONFIG.theme.accent);
  r.setProperty("--accent-hot", CONFIG.theme.accentHot);
  r.setProperty("--accent-deep", CONFIG.theme.accentDeep);
  r.setProperty("--line", CONFIG.theme.line);

  /* HUD */
  const home = document.getElementById("hudHome");
  home.textContent = CONFIG.siteTitle;
  home.href = CONFIG.homeHref;
  if(CONFIG.lang){
    const ls = document.getElementById("langSwitch");
    ls.href = CONFIG.lang.href;
    ls.textContent = CONFIG.lang.label;
    ls.hidden = false;
  }
  const depthBar = document.getElementById("depthBar");
  for(let i=0;i<N;i++){ const s=document.createElement("div"); s.className="depth-seg"; depthBar.appendChild(s); }
  function updateHud(){
    depthBar.querySelectorAll(".depth-seg").forEach((s,i)=>s.classList.toggle("filled", i<current));
    depthBar.setAttribute("aria-label", `Depth progress: level ${current} of ${N}`);
    const earned = current - 1;
    document.getElementById("hudDepth").innerHTML =
      `<span class="hide-s">${T.depth} </span><strong>${T.level} ${current} / ${N}</strong> · ${CONFIG.depthNames[current-1]}` +
      (earned > 0 ? ` · ${CONFIG.token.emoji} ×${earned}` : "");
  }

  /* hero */
  const main = document.getElementById("main");
  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="eyebrow">${CONFIG.hero.eyebrow}</div>
    <h1>${CONFIG.hero.titleHTML}</h1>
    <div class="hero-lede">${CONFIG.hero.icon}<p class="hero-note">${CONFIG.hero.ledeHTML}</p></div>
    <p class="hero-note">${CONFIG.hero.noteHTML}</p>`;
  main.appendChild(hero);

  /* level cards */
  L.forEach((lv,i)=>{
    const n = i+1;
    const card = document.createElement("section");
    card.className = "level" + (n===1 ? "" : " locked");
    card.id = "lv"+n;
    let inner = `
      <div class="level-head">
        <div class="lv-badge">${n}</div>
        <div class="lv-meta"><div class="lv-kicker">${lv.kicker}</div><h2>${lv.title}</h2></div>
      </div>
      <div class="level-body">${lv.bodyHTML}
        ${lv.widget && WIDGETS[lv.widget] ? WIDGETS[lv.widget].html : ""}
        ${lv.afterWidgetHTML || ""}
      </div>`;
    if(n < N){
      inner += `
      <div class="checkpoint">
        <div class="cp-label">◈ ${T.checkpoint} ${n} / ${N}</div>
        <div class="cp-sum">${lv.sum}</div>
        <div class="cp-actions">
          <button class="btn btn-deeper" type="button" data-next="${n+1}">${T.goDeeper} &nbsp;${T.nextLevel} ${n+1}: ${L[n].title}</button>
          <button class="btn btn-stop" type="button" data-stop="${n}">${T.stopHere}</button>
        </div>
        <div class="cp-hint">${T.cpHint.replace("{token}", CONFIG.token.name)}</div>
      </div>`;
    } else {
      inner += `
      <div class="finale">
        <div class="medal" aria-hidden="true">${CONFIG.finale.emoji}</div>
        <h2>${CONFIG.finale.title}</h2>
        <p>${CONFIG.finale.text}</p>
        <a class="btn btn-deeper finale-home" href="${CONFIG.homeHref}">${T.finaleHome}</a>
      </div>`;
    }
    card.innerHTML = inner;
    main.appendChild(card);
    if(lv.widget && WIDGETS[lv.widget]) WIDGETS[lv.widget].init(card);
  });

  /* footer */
  document.getElementById("pageFooter").innerHTML =
    CONFIG.footerHTML + ` · <button type="button" id="resetProg">${T.reset}</button>`;
  document.getElementById("resetProg").addEventListener("click", ()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  /* progress persistence */
  function save(){ try{ localStorage.setItem(KEY, String(current)); }catch(e){} }
  function restore(){
    let saved = 1;
    try{ saved = parseInt(localStorage.getItem(KEY)||"1",10)||1; }catch(e){}
    saved = Math.min(Math.max(saved,1), N);
    for(let n=2;n<=saved;n++) document.getElementById("lv"+n).classList.remove("locked");
    current = saved;
  }

  /* toast */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 2600);
  }

    let lastReward = -1;
  function pickReward(){
    let i;
    do{ i = Math.floor(Math.random()*REWARDS.length); } while(i === lastReward && REWARDS.length > 1);
    lastReward = i;
    return REWARDS[i];
  }

  /* build the reward card shown at the top of a newly opened level.
     `fact` comes from the level just left behind — a bonus nugget one
     layer deeper than what they've read. */
  function rewardCard(fromLevel){
    const r = pickReward(), tok = CONFIG.token;
    const fact = (L[fromLevel-1] || {}).fact;
    return `<div class="reward">
      <div class="reward-top">
        <div class="reward-animal" aria-hidden="true">${r.animal}${tok.emoji}</div>
        <div class="reward-line">${r.line}</div>
      </div>
      <div class="reward-token">${tok.emoji} +1 ${tok.name}${fact ? `<span class="reward-fact">${fact}</span>` : ""}</div>
    </div>`;
  }

  /* unlock */
  function unlock(n){
    const card = document.getElementById("lv"+n);
    if(!card.classList.contains("locked")){
      card.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    card.classList.remove("locked");
    card.classList.add("unlocking");
    current = Math.max(current, n);
    save();
    updateHud();

    /* place the descent reward at the top of the level they just opened */
    const body = card.querySelector(".level-body");
    if(body && !card.dataset.rewarded){
      body.insertAdjacentHTML("afterbegin", rewardCard(n-1));
      card.dataset.rewarded = "1";
    }

    showToast(`⬢ ${T.unlocked.replace("{n}", n)} · ${CONFIG.token.emoji} +1 ${CONFIG.token.name.toUpperCase()}`);
    requestAnimationFrame(()=>setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60));
    card.addEventListener("animationend", ()=>card.classList.remove("unlocking"), {once:true});
  }

  /* surface modal */
  /* surface modal */
  const scrim = document.getElementById("modalScrim");
  const modalList = document.getElementById("modalList");
  let stoppedAt = 1;
  function openModal(n){
    stoppedAt = n;
    document.getElementById("modalLevel").textContent = n;
    modalList.innerHTML = "";
    for(let i=0;i<n;i++){
      const li = document.createElement("li");
      li.textContent = L[i].take;
      modalList.appendChild(li);
    }
    scrim.classList.add("open");
    document.getElementById("modalResume").focus();
  }
  function closeModal(){ scrim.classList.remove("open"); }
  document.getElementById("modalHome").href = CONFIG.homeHref;
  document.getElementById("modalResume").addEventListener("click", ()=>{
    const n = Math.min(stoppedAt+1, N);
    closeModal();
    unlock(n);
  });
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  /* clicks */
  document.body.addEventListener("click", e=>{
    const deeper = e.target.closest("[data-next]");
    if(deeper){ unlock(parseInt(deeper.dataset.next,10)); return; }
    const stop = e.target.closest("[data-stop]");
    if(stop){ openModal(parseInt(stop.dataset.stop,10)); }
  });

  restore();
  restore();
  updateHud();
})();
</script>
</body>
</html>
