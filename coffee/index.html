<script>
/* ================================================================

const CONFIG = {
  slug: "coffee",                       // unique id — used to save progress
  siteTitle: "☕ The Coffee Rabbit Hole",
  homeHref: "../index.html",

  /* Your GitHub repository, as "username/repo". Used by the
     experiment lab's "share in the community thread" link.
     ⚠ Replace this once your repository exists.               */
  githubRepo: "yourusername/rabbit-holes",

  theme: {                              // per-hole colour scheme
    accent: "#E8A44C",
    accentHot: "#FFC46B",
    accentDeep: "#8A5A1E",
    line: "rgba(232,164,76,.16)"
  },

  depthNames: ["Surface","Shallows","Impostor Zone","Clock Layer","Enzyme Works",
               "Gene Vault","Adaptation Trench","Modifier Fields","Twilight Stratum","Bedrock"],

  hero: {
    eyebrow: "An interactive descent · 10 levels deep",
    titleHTML: 'Why can some people drink coffee at night and <em>still sleep?</em>',
    icon: `<svg width="74" height="70" viewBox="0 0 74 70" fill="none" aria-hidden="true">
      <g class="steam">
        <path d="M24 22c0-5 4-5 4-10s-4-5-4-9"/><path d="M36 20c0-5 4-5 4-10s-4-5-4-9"/><path d="M48 22c0-5 4-5 4-10s-4-5-4-9"/>
      </g>
      <path d="M14 30h44v14a22 22 0 0 1-44 0V30z" fill="#16203A" stroke="currentColor" stroke-width="2" style="color:var(--accent)"/>
      <path d="M17 33h38v6c-6 4-32 4-38 0v-6z" fill="var(--accent)" opacity=".5"/>
      <path d="M58 34h5a7 7 0 0 1 0 14h-6" stroke="var(--accent)" stroke-width="2" fill="none"/></svg>`,
    ledeHTML: `Your cousin downs a double espresso at 9pm and is snoring by 10.30. You <b>look</b> at a latte after lunch and stare at the ceiling until 2am. Neither of you is imagining it — and the real answer runs ten levels deep.`,
    noteHTML: `Descend as far as you like. Every level ends with a <b>checkpoint</b>: stop and surface with a complete answer, or go deeper.`
  },

  footerHTML: `Built as an interactive explainer · Figures (half-lives, enzyme variation, study findings) reflect published sleep &amp; pharmacology research and are approximate for individuals.`,

  finale: {
    emoji: "☕",
    title: "Depth 10 / 10 — Bottom reached",
    text: "You descended from “some people are just built differently” to genes, enzymes, receptor warfare, and the limits of your own perception of sleep. That's the whole rabbit hole. Sleep well — or at least, know exactly why you don't."
  },

  /* --- The ten levels. Each has:
       kicker   — small label above the title
       title    — level heading
       bodyHTML — the content (use <p>, .callout, .stat-row as in the CSS)
       widget   — optional key into WIDGETS, injected after bodyHTML
       sum      — checkpoint summary shown at the stopping point
       take     — one-line takeaway listed in the "You surfaced" recap     --- */
  levels: [
    {
      kicker:"Level 1 · The Surface",
      title:"It's real, and it's not willpower",
      bodyHTML:`
        <p>The short answer: <strong>people process and respond to caffeine at wildly different speeds</strong>, and both of those things are largely set by biology — not habit, discipline, or “just being used to it”.</p>
        <p>Two people drinking the same 9pm espresso are not running the same experiment. By midnight, one body may have already destroyed most of the caffeine, whilst the other still carries a nearly full dose. And even with equal caffeine on board, one brain may barely register it.</p>
        <p class="dim">Everything below this level explains <em>how</em> that happens — molecule by molecule.</p>`,
      sum:"A good stopping point: people differ hugely in how fast they clear caffeine and how strongly their brain reacts to it — and that's biology, not habit.",
      take:"Night-coffee sleepers aren't tougher — their bodies clear caffeine faster and/or their brains react to it less. It's biology.",
      puzzle:{
        q:"What mainly separates the night-espresso sleeper from everyone else?",
        options:["Stronger willpower and better habits","Biology: how fast they clear caffeine and how their brain responds","They secretly drink decaf","They've simply trained themselves not to notice tiredness"],
        answer:1,
        hint:"The level's title says it plainly: it's real, and it's not willpower."
      }
    },
    {
      kicker:"Level 2 · The Molecule",
      title:"Caffeine doesn't give energy — it hides tiredness",
      bodyHTML:`
        <p>First, a myth to bury: caffeine isn't fuel. It adds zero energy to your body. It's a small plant-made molecule (plants evolved it partly as a natural insecticide) that works by <strong>blocking a signal</strong>, not by creating one.</p>
        <p>Think of it as a masking agent. Your tiredness is still there, accumulating in the background the whole time. Caffeine simply prevents your brain from <em>hearing</em> it.</p>
        <div class="callout"><span class="tag">Key idea</span>
        If caffeine only mutes a signal, then two things decide the night: <strong>how loud your sleepiness signal is</strong>, and <strong>how long the mute button stays pressed</strong>. Both differ between people.</div>`,
      sum:"A good stopping point: caffeine adds no energy — it temporarily mutes your brain's sleepiness signal.",
      take:"Caffeine is a masking agent: it blocks the sleepiness signal instead of adding energy.",
      puzzle:{
        q:"What does caffeine actually do?",
        options:["Adds a small amount of energy to the body","Speeds the heart up enough to keep you awake","Blocks a signal so your brain can't hear its own tiredness","Burns adenosine as fuel"],
        answer:2,
        hint:"It's a masking agent — it hides something rather than adding anything."
      }
    },
    {
      kicker:"Level 3 · The Impostor",
      title:"Adenosine, sleep pressure, and a shape-shifter",
      bodyHTML:`
        <p>Every hour you're awake, your brain cells burn energy and leave behind a byproduct called <strong>adenosine</strong>. It builds up like sand in an hourglass. When adenosine docks into its receptors, neurones quieten down and you feel that heavy-lidded pull towards sleep. Scientists call this <strong>sleep pressure</strong>.</p>
        <p>Here's the trick: the caffeine molecule happens to be shaped enough like adenosine to <strong>fit into the same parking spaces</strong> — mainly receptors called A1 and A2A — without switching them on. It's an impostor occupying the seat so the real messenger can't sit down.</p>
        <p class="dim">Crucially, adenosine keeps piling up behind the blockade. When the caffeine finally leaves, all that backed-up sleepiness floods in at once — the infamous crash.</p>`,
      sum:"A good stopping point: caffeine impersonates adenosine and blocks the receptors that make you feel sleepy — whilst real sleep pressure keeps building behind it.",
      take:"It works by impersonating adenosine, parking in sleep receptors (A1/A2A) without activating them — sleep pressure keeps building behind the blockade.",
      puzzle:{
        q:"Caffeine parks in receptors that were built for which molecule?",
        options:["Melatonin","Dopamine","Cortisol","Adenosine"],
        answer:3,
        hint:"It's the byproduct that builds up like sand in an hourglass whilst you're awake."
      }
    },
    {
      kicker:"Level 4 · The Clock",
      title:"The half-life problem",
      bodyHTML:`
        <p>Caffeine leaves the body slowly. Its average <strong>half-life is about five hours</strong> — but “average” is doing a lot of work in that sentence. Depending on the person, the true half-life ranges from roughly <strong>2 to over 10 hours</strong>.</p>
        <p>That single number rewrites the whole night. Try it:</p>`,
      widget:"halfLife",
      afterWidgetHTML:`<p class="dim">A fast metaboliser's 9pm espresso is mostly gone by midnight. A slow metaboliser's <em>3pm</em> coffee can still be a quarter-dose at 1am. Same drink, different night.</p>`,
      sum:"A good stopping point: caffeine's half-life averages ~5 hours but ranges from ~2 to 10+ between people — that alone can decide the night.",
      take:"Half-life varies from ~2 to 10+ hours between people, so the same evening cup can be a trace or nearly a full dose at bedtime.",
      puzzle:{
        q:"What's the average half-life of caffeine?",
        options:["About 30 minutes","About 5 hours","About 24 hours","About 3 days"],
        answer:1,
        hint:"Long enough that a 3pm coffee can still matter at bedtime for slow metabolisers."
      }
    },
    {
      kicker:"Level 5 · The Factory",
      title:"Your liver's speed dial: CYP1A2",
      bodyHTML:`
        <p>So what sets your half-life? Almost entirely one enzyme. In the liver, a protein called <strong>CYP1A2</strong> dismantles about <strong>95% of the caffeine</strong> you consume, snipping it into smaller molecules that get flushed out.</p>
        <p>How much CYP1A2 you produce — and how energetically it works — varies enormously from person to person. Measured activity can differ by <strong>up to ~40-fold</strong> across individuals.</p>
        <div class="stat-row">
          <div class="stat"><div class="n">~95%</div><div class="l">of caffeine cleared by the CYP1A2 enzyme</div></div>
          <div class="stat"><div class="n">40×</div><div class="l">variation in enzyme activity between people</div></div>
          <div class="stat"><div class="n">1</div><div class="l">main gene controlling the whole assembly line</div></div>
        </div>
        <p class="dim">People casually say “fast metaboliser” and “slow metaboliser”. This enzyme is what they're actually talking about. And what controls the enzyme? One level down.</p>`,
      sum:"A good stopping point: one liver enzyme, CYP1A2, clears ~95% of caffeine, and its activity varies up to ~40-fold between people.",
      take:"One enzyme — CYP1A2 — clears ~95% of caffeine, and its speed varies up to ~40× between people.",
      puzzle:{
        q:"Which enzyme dismantles about 95% of the caffeine you drink?",
        options:["ADORA2A","Lactase","CYP1A2","Melatonin synthase"],

        hint:"It's the liver's speed dial — this level is named after it."

    },
    {
      kicker:"Level 6 · The Code",
      title:"The genetic lottery",
      bodyHTML:`
        <p>Two genes dominate the story:</p>
        <p><strong>CYP1A2 — the clearance gene.</strong> A single-letter variant (geneticists know it as <em>rs762551</em>) splits the population. People with two copies of the “A” version build a fast, inducible enzyme and shred caffeine quickly. Carriers of the “C” version run the slow assembly line — the same cup lingers for hours longer.</p>
        <p><strong>ADORA2A — the sensitivity gene.</strong> This one builds the A2A adenosine receptor itself — caffeine's actual target. Variants here (such as <em>rs5751876</em>) change how strongly the brain reacts to a blocked receptor. Some variants are linked to caffeine-induced anxiety and measurably worse sleep after evening caffeine; others make the brain relatively indifferent.</p>
        <div class="callout"><span class="tag">The 2×2 of coffee drinkers</span>
        Fast clearance <em>and</em> low sensitivity → the friend with a post-dinner espresso ritual. Slow clearance <em>and</em> high sensitivity → the person wrecked by an afternoon green tea. Most of us land somewhere between.</div>`,
      sum:"A good stopping point: variants in CYP1A2 set your clearance speed, and variants in ADORA2A set how sensitive your brain is to what remains.",
      take:"Two genes run the show: CYP1A2 variants set clearance speed; ADORA2A variants set how hard the brain reacts to a blocked receptor.",
      puzzle:{
        q:"What does the ADORA2A gene decide?",
        options:["How fast the liver clears caffeine","How strongly the brain reacts to a blocked receptor","How bitter coffee tastes to you","How much adenosine you produce per hour"],
        answer:1,
        hint:"CYP1A2 is the clearance gene; ADORA2A is the sensitivity gene."
      }
    },
    {
      kicker:"Level 7 · The Counterattack",
      title:"Tolerance: the brain fights back",
      bodyHTML:`
        <p>Genes aren't the whole story — the brain adapts. Blockade its adenosine receptors every day, and it responds like any besieged system: it <strong>builds more receptors</strong> (and adjusts related signalling), so the same dose blocks a smaller <em>fraction</em> of the total.</p>
        <p>Within a week or two of daily use, much of caffeine's alerting punch fades. This is why a habitual four-cup drinker can feel almost nothing from a nightcap coffee that would leave a caffeine-naïve person vibrating.</p>
        <p>Two catches. First, tolerance to caffeine's <strong>sleep-disrupting effects is only partial</strong> — regular drinkers still show measurable sleep changes in lab studies. Second, all those extra receptors are why quitting hurts: with no caffeine in the seats, normal adenosine levels suddenly hit an oversized receptor array. That's the withdrawal headache and fog.</p>`,
      sum:"A good stopping point: daily use makes the brain grow extra adenosine receptors, dulling caffeine's kick — but tolerance to its sleep disruption is only partial.",
      take:"Daily use builds tolerance — the brain adds adenosine receptors — but tolerance to caffeine's sleep disruption is only partial.",
      puzzle:{
        q:"How does the brain adapt to daily caffeine?",
        options:["It builds more adenosine receptors","It stops producing adenosine altogether","It shrinks its adenosine receptors","It learns to break caffeine down itself"],
        answer:0,
        hint:"Think of a besieged system adding more seats than the impostor can occupy."
      }
    },
    {
      kicker:"Level 8 · The Modifiers",
      title:"Things that secretly move your dial",
      bodyHTML:`
        <p>CYP1A2 isn't fixed at birth-speed forever. Everyday factors crank it up or throttle it down:</p>
        <p><strong>Speeds clearance up:</strong> smoking roughly <em>doubles</em> caffeine breakdown (which is partly why smokers often drink more coffee — and why quitting smoking suddenly makes their usual intake feel excessive). Plenty of cruciferous vegetables and char-grilled meat also nudge the enzyme up.</p>
        <p><strong>Slows clearance down:</strong> oral contraceptives can roughly double the half-life. Pregnancy is dramatic — by the third trimester, caffeine's half-life can stretch to <strong>15 hours or more</strong>. Certain medications (the antidepressant fluvoxamine is the classic example) can nearly shut the enzyme off. Liver disease and even acute alcohol slow it too.</p>
        <div class="callout"><span class="tag">Translation</span>
        Your caffeine tolerance isn't just <em>yours</em> — it's yours <em>right now</em>. The person who “could always sleep after coffee” can lose that ability by changing a prescription, quitting cigarettes, or becoming pregnant.</div>`,
      sum:"A good stopping point: smoking speeds caffeine clearance; contraceptives, pregnancy and some medications slow it dramatically. Your tolerance is a moving target.",
      take:"Life modifies the dial: smoking doubles clearance; contraceptives, pregnancy (15 h+ half-life) and some medications slow it drastically.",
      puzzle:{
        q:"Which of these dramatically SLOWS caffeine clearance?",
        options:["Smoking","Char-grilled meat","Pregnancy","Cruciferous vegetables"],
        answer:2,
        hint:"By the third trimester the half-life can stretch to 15 hours or more."
      }
    },
    {
      kicker:"Level 9 · The Plot Twist",
      title:"“Still sleeps” is not the same as “sleeps well”",
      bodyHTML:`
        <p>Here's the level most people never reach. Falling asleep is only one measurement — and it's the one we're worst at judging ourselves.</p>
        <p>In sleep-laboratory studies, evening caffeine reliably <strong>cuts deep, slow-wave sleep</strong> — the physically restorative stage — and can delay the body's internal clock by pushing back melatonin release, even in people who report sleeping “fine”. One well-known controlled study gave people 400&nbsp;mg of caffeine a full <strong>six hours before bed</strong>: objective monitors showed they lost over an hour of sleep, whilst the participants themselves barely noticed the difference.</p>
        <p>So part of the honest answer to our big question is uncomfortable: <strong>some night-coffee drinkers aren't unaffected — they're unaware.</strong> They fall asleep on schedule but skim shallower waters all night, then blame the resulting grogginess on needing… more coffee.</p>
        <p class="dim">That said, the genetic lottery is real here too: studies suggest fast metabolisers and low-sensitivity genotypes show smaller objective sleep disruption. Some people genuinely do get away with it. Fewer than believe they do.</p>`,
      sum:"A good stopping point: many people who “sleep fine” after coffee are losing deep sleep without noticing — falling asleep isn't the whole story.",
      take:"“Still sleeps” ≠ “sleeps well”: evening caffeine cuts deep slow-wave sleep even in people who notice nothing. Some are unaffected; more are simply unaware.",
      puzzle:{
        q:"In the study that gave people 400 mg of caffeine six hours before bed, what happened?",
        options:["They slept better than the control group","They lost over an hour of sleep but barely noticed","They couldn't fall asleep at all","Nothing — six hours is plenty of clearance time"],
        answer:1,
        hint:"The uncomfortable phrase from this level: not unaffected — unaware."
      }
    },
    {
      kicker:"Level 10 · The Bottom of the Cup",
      title:"The full equation — and how to test yourself",
      bodyHTML:`
        <p>Assemble everything and the mystery dissolves into a stack of multipliers:</p>
        <div class="callout"><span class="tag">The night-coffee equation</span>
        <strong>Dose × timing</strong> → filtered by <strong>enzyme speed (CYP1A2 gene + modifiers)</strong> → hits a brain tuned by <strong>receptor genetics (ADORA2A)</strong> and reshaped by <strong>tolerance</strong> → competes against your accumulated <strong>sleep pressure</strong> that night. The output is whether — and how deeply — you sleep.</div>
        <p>Your cousin who sleeps after espresso likely rolled fast-clearance genes, low-sensitivity receptors, a daily habit that built tolerance, and enough sleep pressure by 10pm to overwhelm what little caffeine remains. You may have rolled the opposite hand. Neither of you chose it.</p>
        <p><strong>Want your own answer without a DNA test?</strong> Run the ten-day experiment: keep your normal coffee for five days, then hold a strict caffeine curfew (nothing after ~midday) for five more. Track how long it takes to fall asleep, night wakings, and — most telling — how you feel at 9am. If the curfew week feels noticeably better, your genes have voted.</p>`,
      widget:"discussPanel",
      afterWidgetHTML:`
        <p class="dim">One caveat worth keeping: this page explains mechanisms, not medical advice. Sleep problems that persist regardless of caffeine deserve a proper appointment with your GP.</p>`,
      sum:"",
      take:"The full equation: dose × timing × enzyme speed × receptor genetics × tolerance × sleep pressure. Test yourself with a ten-day caffeine-curfew experiment."
    }
  ]
};

/* --- Optional interactive widgets. Key = the `widget` name used in a level. --- */
const WIDGETS = {
  halfLife: {
    html: `
      <div class="sim">
        <h4>Bedtime caffeine simulator</h4>
        <div class="sim-grid">
          <div>
            <label>Caffeine dose · <output data-out="dose">150 mg</output> <span style="opacity:.7">(espresso ≈ 65, coffee ≈ 100–200)</span></label>
            <input type="range" data-in="dose" min="30" max="300" step="5" value="150">
          </div>
          <div>
            <label>Hours between the cup and bedtime · <output data-out="hours">3 h</output></label>
            <input type="range" data-in="hours" min="0" max="12" step="0.5" value="3">
          </div>
          <div>
            <label>Metaboliser speed (half-life)</label>
            <div class="metab-toggle" data-in="metab">
              <button data-hl="2.5" type="button">⚡ Fast · 2.5 h</button>
              <button data-hl="5" class="active" type="button">Average · 5 h</button>
              <button data-hl="9" type="button">🐢 Slow · 9 h</button>
            </div>
          </div>
        </div>
        <div class="sim-result">
          <div class="big" data-out="mg">99 mg</div>
          <div class="cap">still circulating at lights-out</div>
          <div class="sim-verdict mid" data-out="verdict">Roughly a full espresso still on board.</div>
        </div>
      </div>`,
    init(root){
      const dose = root.querySelector('[data-in="dose"]');
      const hours = root.querySelector('[data-in="hours"]');
      const metab = root.querySelector('[data-in="metab"]');
      const out = k => root.querySelector(`[data-out="${k}"]`);
      let halfLife = 5;
      function run(){
        const d = parseFloat(dose.value), h = parseFloat(hours.value);
        out("dose").textContent = d + " mg";
        out("hours").textContent = h + " h";
        const mg = Math.round(d * Math.pow(0.5, h / halfLife));
        out("mg").textContent = mg + " mg";
        let cls, msg;
        if(mg >= 90){ cls="bad"; msg="More than a full espresso still on board — the receptors stay blocked deep into the night."; }
        else if(mg >= 40){ cls="mid"; msg="Roughly an espresso's worth remaining — enough to shave deep sleep for many people."; }
        else if(mg >= 15){ cls="mid"; msg="A weak-tea trace remains. Sensitive brains may still notice; most won't."; }
        else { cls="good"; msg="Effectively cleared — sleep pressure wins this round."; }
        const v = out("verdict");
        v.className = "sim-verdict " + cls;
        v.textContent = msg;
      }
      dose.addEventListener("input", run);
      hours.addEventListener("input", run);
      metab.addEventListener("click", e=>{
        const btn = e.target.closest("button[data-hl]");
        if(!btn) return;
        metab.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        halfLife = parseFloat(btn.dataset.hl);
        run();
      });
      run();
    }
  },

  /* ---- Level 10: the discussion panel (links out to GitHub — nothing is logged here) ---- */
  discussPanel: {
    html: `
      <div class="sim">
        <h4>The discussion panel</h4>
        <p style="font-size:14.5px;color:var(--dim)">Ran the ten-day experiment? Spotted an error? Have a theory of your own? The conversation for this rabbit hole lives on GitHub — public and free to join. This page stores nothing and logs nothing about you.</p>
        <div class="share-row">
          <a class="btn btn-deeper btn-mini" data-el="discuss" target="_blank" rel="noopener">💬 Share your results or comment</a>
          <a class="btn btn-stop btn-mini" data-el="read" target="_blank" rel="noopener">Read what others found</a>
        </div>
        <div class="share-note">Opens this project's GitHub Discussions in a new tab. A free GitHub account is all you need to post.</div>
      </div>`,
    init(root){
      const url = "https://github.com/" + CONFIG.githubRepo + "/discussions";
      root.querySelector('[data-el="discuss"]').href = url;
      root.querySelector('[data-el="read"]').href = url;
    }
  }
};

/* ================================================================
   ⚙️  ENGINE — shared across every rabbit hole. No need to edit.
   ================================================================ */
(function(){
  "use strict";
  const L = CONFIG.levels, N = L.length;
  const KEY = "rh-progress-" + CONFIG.slug;
  let current = 1;

  /* theme */
  const r = document.documentElement.style;
  r.setProperty("--accent", CONFIG.theme.accent);
  r.setProperty("--accent-hot", CONFIG.theme.accentHot);
  r.setProperty("--accent-deep", CONFIG.theme.accentDeep);
  r.setProperty("--line", CONFIG.theme.line);

  /* HUD */
  const home = document.getElementById("hudHome");
  home.textContent = CONFIG.siteTitle;
  home.href = CONFIG.homeHref;
  const depthBar = document.getElementById("depthBar");
  for(let i=0;i<N;i++){ const s=document.createElement("div"); s.className="depth-seg"; depthBar.appendChild(s); }
  function updateHud(){
    depthBar.querySelectorAll(".depth-seg").forEach((s,i)=>s.classList.toggle("filled", i<current));
    depthBar.setAttribute("aria-label", `Depth progress: level ${current} of ${N}`);
    const beans = current - 1;
    document.getElementById("hudDepth").innerHTML =
      `<span class="hide-s">Depth </span><strong>Level ${current} / ${N}</strong> · ${CONFIG.depthNames[current-1]}` +
      (beans > 0 ? ` · ☕ ×${beans}` : "");
  }

  /* hero */
  const main = document.getElementById("main");
  const hero = document.createElement("section");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="eyebrow">${CONFIG.hero.eyebrow}</div>
    <h1>${CONFIG.hero.titleHTML}</h1>
    <div class="hero-lede">${CONFIG.hero.icon}<p class="hero-note">${CONFIG.hero.ledeHTML}</p></div>
    <p class="hero-note">${CONFIG.hero.noteHTML}</p>`;
  main.appendChild(hero);

  /* level cards */
  L.forEach((lv,i)=>{
    const n = i+1;
    const card = document.createElement("section");
    card.className = "level" + (n===1 ? "" : " locked");
    card.id = "lv"+n;
    let inner = `
      <div class="level-head">
        <div class="lv-badge">${n}</div>
        <div class="lv-meta"><div class="lv-kicker">${lv.kicker}</div><h2>${lv.title}</h2></div>
      </div>
      <div class="level-body">${lv.bodyHTML}
        ${lv.widget && WIDGETS[lv.widget] ? WIDGETS[lv.widget].html : ""}
        ${lv.afterWidgetHTML || ""}
      </div>`;
    if(n < N){
      const pzHTML = lv.puzzle ? `
        <div class="puzzle" data-puzzle="${n}" hidden>
          <div class="pz-label">🔐 Depth lock — one question to descend</div>
          <div class="pz-q">${lv.puzzle.q}</div>
          <div class="pz-opts">${lv.puzzle.options.map((o,j)=>`<button type="button" data-opt="${j}">${o}</button>`).join("")}</div>
          <div class="pz-feed" hidden></div>
        </div>` : "";
      inner += `
      <div class="checkpoint">
        <div class="cp-label">◈ Checkpoint ${n} / ${N}</div>
        <div class="cp-sum">${lv.sum}</div>
        <div class="cp-actions">
          <button class="btn btn-deeper" type="button" data-next="${n+1}">Go deeper ↓ &nbsp;Level ${n+1}: ${L[n].title}</button>
          <button class="btn btn-stop" type="button" data-stop="${n}">Stop here — I've learnt enough</button>
        </div>${pzHTML}
        <div class="cp-hint">Stopping here is a legitimate ending — every level above is a complete answer at its own depth. Going deeper means picking the depth lock: one question, answered from the level you've just read, worth one bean.</div>
      </div>`;
    } else {
      inner += `
      <div class="finale">
        <div class="medal" aria-hidden="true">${CONFIG.finale.emoji}</div>
        <h2>${CONFIG.finale.title}</h2>
        <p>${CONFIG.finale.text}</p>
      </div>`;
    }
    card.innerHTML = inner;
    main.appendChild(card);
    if(lv.widget && WIDGETS[lv.widget]) WIDGETS[lv.widget].init(card);
  });

  /* footer */
  document.getElementById("pageFooter").innerHTML =
    CONFIG.footerHTML + ` · <button type="button" id="resetProg">Reset my progress</button>`;
  document.getElementById("resetProg").addEventListener("click", ()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  /* progress persistence */
  function save(){ try{ localStorage.setItem(KEY, String(current)); }catch(e){} }
  function restore(){
    let saved = 1;
    try{ saved = parseInt(localStorage.getItem(KEY)||"1",10)||1; }catch(e){}
    saved = Math.min(Math.max(saved,1), N);
    for(let n=2;n<=saved;n++) document.getElementById("lv"+n).classList.remove("locked");
    current = saved;
  }

  /* toast */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 2600);
  }

  /* unlock */
  function unlock(n, msg){
    const card = document.getElementById("lv"+n);
    if(!card.classList.contains("locked")){
      card.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    card.classList.remove("locked");
    card.classList.add("unlocking");
    current = Math.max(current, n);
    save();
    updateHud();
    showToast(msg || `⬢ LEVEL ${n} UNLOCKED — ${L[n-1].title.toUpperCase()}`);
    requestAnimationFrame(()=>setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60));
    card.addEventListener("animationend", ()=>card.classList.remove("unlocking"), {once:true});
  }

  /* surface modal */
  const scrim = document.getElementById("modalScrim");
  const modalList = document.getElementById("modalList");
  let stoppedAt = 1;
  function openModal(n){
    stoppedAt = n;
    document.getElementById("modalLevel").textContent = n;
    modalList.innerHTML = "";
    for(let i=0;i<n;i++){
      const li = document.createElement("li");
      li.textContent = L[i].take;
      modalList.appendChild(li);
    }
    scrim.classList.add("open");
    document.getElementById("modalResume").focus();
  }
  function closeModal(){ scrim.classList.remove("open"); }
  document.getElementById("modalHome").href = CONFIG.homeHref;
  document.getElementById("modalResume").addEventListener("click", ()=>{ closeModal(); unlock(Math.min(stoppedAt+1, N)); });
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  /* clicks */
  document.body.addEventListener("click", e=>{
    const deeper = e.target.closest("[data-next]");
    if(deeper){
      const n = parseInt(deeper.dataset.next,10);           // level to open
      const card = document.getElementById("lv"+n);
      const pzPanel = document.querySelector(`[data-puzzle="${n-1}"]`);
      if(card.classList.contains("locked") && pzPanel){
        pzPanel.hidden = false;                             // present the depth lock
        pzPanel.scrollIntoView({behavior:"smooth", block:"nearest"});
      } else {
        unlock(n);                                          // already unlocked, or no puzzle set
      }
      return;
    }
    const opt = e.target.closest(".pz-opts button");
    if(opt){
      const panel = opt.closest(".puzzle");
      const lvN = parseInt(panel.dataset.puzzle,10);        // level the puzzle sits in
      const pz = L[lvN-1].puzzle;
      if(parseInt(opt.dataset.opt,10) === pz.answer){
        panel.hidden = true;
        panel.querySelector(".pz-feed").hidden = true;
        panel.dataset.wrong = "0";
        unlock(lvN+1, `⬢ LOCK PICKED — LEVEL ${lvN+1} UNLOCKED · ☕ +1 BEAN`);
      } else {
        const wrong = (parseInt(panel.dataset.wrong||"0",10) + 1);
        panel.dataset.wrong = String(wrong);
        const feed = panel.querySelector(".pz-feed");
        feed.hidden = false;
        feed.textContent = (wrong > 1 && pz.hint)
          ? "Hint: " + pz.hint
          : "Not quite — the answer is hiding in the level you've just read.";
        panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
      }
      return;
    }
    const stop = e.target.closest("[data-stop]");
    if(stop){ openModal(parseInt(stop.dataset.stop,10)); }
  });

  restore();
  updateHud();
})();
</script>
